<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo tabla. Semantico .Avanzado</title>
</head>

<body>
    <p>
        <a href="index.html">👈 Volver atrás
        </a>
    </p>

    <hr />
    <!--Se crea un enlace para regresar a la página principal (index.html).
    La etiqueta <hr> dibuja una línea horizontal que separa visualmente
    esta sección del resto del contenido.-->
    <h1>Ejemplo 9.5</h1>
    <h2>Tabla compleja, con rowspan y colspan, semántica</h2>

    <table border="1"
           summary="colspan+rowspan">
           <thead>
                <tr>
                    <th rowspan="2">Año</th>
                    <th colspan="4">Expansión de ventas</th>
                </tr>

                <tr>
                    <th>Producto A</th>
                    <th>Producto B</th>
                    <th>Producto C</th>
                    <th>Producto D</th>
                </tr>
            </thead>

            <tfoot>
                <tr>
                    <th rowspan="2">Año</th>
                    <th>Producto A</th>
                    <th>Producto B</th>
                    <th>Producto C</th>
                    <th>Producto D</th>
                </tr>

                <tr>
                    <th colspan="4">Expansión de ventas</th>
                </tr>
            </tfoot>

            <tbody>
                <tr>
                    <td>N.3</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                    <td>-</td>
                </tr>

                <tr>
                    <td>N.2</td>
                    <td>3</td>
                    <td>5</td>
                    <td>8</td>
                    <td>4</td>
                </tr>

                <tr>
                    <td>N.1</td>
                    <td>4</td>
                    <td>4</td>
                    <td>7</td>
                    <td>3</td>
                </tr>

                <tr>
                    <td>N</td>
                    <td>5</td>
                    <td>7</td>
                    <td>6</td>
                    <td>2</td>
                </tr>

            </tbody>
    </table>
</body>
</html>

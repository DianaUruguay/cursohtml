<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo tabla semántica</title>
</head>

<body>
    <p>
        <a href="index.html">👈 Volver atrás
        </a>
    </p>

    <hr />
    <!--Se crea un enlace para regresar a la página principal (index.html).
    La etiqueta <hr> dibuja una línea horizontal que separa visualmente
    esta sección del resto del contenido.-->
    <h1>Ejemplo 9.6</h1>
    <h2>Tabla semántica.</h2>

    <table border="1"
           summary="tabla semántica">
           <thead>
                <tr>
                    <th>Materia</th>
                    <th>Calificación</th>
                </tr>
            </thead>

            <tfoot>
                <tr>
                    <td><strong>Promedio</strong></td>
                    <td>87.6</td>
                </tr>
            </tfoot>

            <tbody>
                <tr>
                    <td>Redes inalámbricas</td>
                    <td>95</td>
                </tr>

                <tr>
                    <td>Introducción a la inteligencia artificial</td>
                    <td>98</td>
                </tr>

                <tr>
                    <td>Compiladores e intérpretes</td>
                    <td>70</td>
                </tr>
            </tbody>
    </table>
</body>
</html>

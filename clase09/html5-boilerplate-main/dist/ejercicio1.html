<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo sencillo fusión de columnas</title>
</head>

<body>
    <p>
        <a href="index.html">👈 Volver atrás
        </a>
    </p>

    <hr />
    <!--Se crea un enlace para regresar a la página principal (index.html).
    La etiqueta <hr> dibuja una línea horizontal que separa visualmente
    esta sección del resto del contenido.-->
    <h1>Ejemplo 9.1</h1>
    <h2>Fusión de columnas.</h2>

    <table border="1"
           summary="Ejemplo sencillo de fusión de columnas">
           <tr>
                <th colspan="2">A</th>
           </tr>

           <tr>
                <td>B</td>
                <td>C</td>
           </tr>
    </table>
</body>
</html>

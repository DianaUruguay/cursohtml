<!DOCTYPE html> <!-- Indica que este documento utiliza HTML5 -->
<!-- El contenido de la página está en español -->
<html lang="es">
<!-- Información sobre la página que no se muestra directamente al usuario -->
<head>
    <!-- Título que aparece en la pestaña del navegador -->
    <title>Mi Primera Página Web</title>
    <!-- Breve descripción de la página. Puede ser utilizada por buscadores -->
    <meta name="description" content="Primera práctica de HTML. DianaUruguay. Aquí comienzo mi recorrido por el desarrollo frontend.">
    <!-- Permite mostrar correctamente caracteres especiales como tildes y la ñ -->
    <meta charset="UTF-8">
    <!-- Define el color principal de la interfaz en algunos navegadores -->
    <meta name="theme-color" content="#2563EB">
</head>
<!-- Contenido visible de la página -->
<body>
    <!-- Encabezado principal de la página -->
    <h1>¡Bienvenido!</h1>
     <!-- Primer párrafo del contenido -->
    <p>
        Esta es mi primera página web.
        ¡Por fin llegué al frontend! Soy Diana, de Uruguay.
        Profe de Matemáticas y Física con 53 años, 
        en transición a la tecnología.  Podés conocer mi perfil en:
    <a href="https://github.com/DianaUruguay">
        GitHub
    </a>
    </p>
</body>
<hr>
<footer>
    © 2026 - DianaUruguay - Ejercicios de HTML
</footer>

</html>
